[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keynetra-client"
version = "0.1.1"
description = "Official Python Client SDK for the KeyNetra authorization platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sainath.Sapa", email = "info.djsai\@gmail.com" }]
dependencies = [
    "urllib3>=2.1.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.11",
    "typing-extensions>=4.7.1",
]

[project.urls]
Homepage = "https://github.com/keynetra/keynetra-client-python"
Repository = "https://github.com/keynetra/keynetra-client-python"
Issues = "https://github.com/keynetra/keynetra-client-python/issues"

[tool.setuptools.packages.find]
include = ["keynetra_client*"]
