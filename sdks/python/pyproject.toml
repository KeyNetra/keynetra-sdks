[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keynetra-client"
version = "0.1.0"
description = "Official Python SDK for the KeyNetra authorization platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KeyNetra Engineering", email = "business.keynetra@gmail.com" }]
dependencies = ["urllib3>=2"]

[project.urls]
Homepage = "https://github.com/keynetra/keynetra-sdks"
Repository = "https://github.com/keynetra/keynetra-sdks"
Issues = "https://github.com/keynetra/keynetra-sdks/issues"

[tool.setuptools.packages.find]
include = ["keynetra_client*"]
