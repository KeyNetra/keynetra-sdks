name: 🚀 KeyNetra SDK Release

on:
  push:
    tags:
      - sdk-v*
  workflow_dispatch:

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REGISTRY_WAIT: 60

# ------------------------------------------------------------
# BUILD SDKs
# ------------------------------------------------------------

jobs:

  prepare:
    name: 🏗 Generate SDKs
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract version
        id: version
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed 's/^sdk-v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install OpenAPI Generator
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Generate SDKs
        env:
          SDK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/generate-all.sh
          ./scripts/generate-all.sh

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdks
          path: sdks

# ------------------------------------------------------------
# LOCAL TESTS
# ------------------------------------------------------------

  smoke-test:
    name: 🧪 Local Test (${{ matrix.lang }})
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, go, rust, dotnet]

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdks

      # Python
      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.11"

      - name: Test Python
        if: matrix.lang == 'python'
        run: |
          cd sdks/python
          pip install build
          python -m build

      # TypeScript
      - uses: actions/setup-node@v4
        if: matrix.lang == 'typescript'
        with:
          node-version: 20

      - name: Test TypeScript
        if: matrix.lang == 'typescript'
        run: |
          cd sdks/typescript
          npm install
          npm run build

      # Go
      - uses: actions/setup-go@v5
        if: matrix.lang == 'go'
        with:
          go-version: "1.22"

      - name: Test Go
        if: matrix.lang == 'go'
        run: |
          cd sdks/go
          go mod init tmp || true
          go mod tidy
          go build ./...

      # Rust
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'

      - name: Test Rust
        if: matrix.lang == 'rust'
        run: |
          cd sdks/rust
          cargo build

      # .NET
      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'dotnet'
        with:
          dotnet-version: 8.0.x

      - name: Test .NET
        if: matrix.lang == 'dotnet'
        run: |
          cd sdks/csharp
          dotnet build

# ------------------------------------------------------------
# PUBLISH SDKs (PARALLEL)
# ------------------------------------------------------------

  publish:
    name: 📦 Publish (${{ matrix.lang }})
    needs: [prepare, smoke-test]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        lang: [python, typescript, rust, dotnet]

    steps:

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sdks
          path: sdks

# ---------------- Python ----------------

      - uses: actions/setup-python@v5
        if: matrix.lang == 'python'
        with:
          python-version: "3.11"

      - name: Publish Python
        if: matrix.lang == 'python'
        run: |
          cd sdks/python
          pip install build twine
          python -m build

          twine upload dist/* \
          --skip-existing \
          -u __token__ \
          -p ${{ secrets.PYPI_TOKEN }}

# ---------------- TypeScript ----------------

      - uses: actions/setup-node@v4
        if: matrix.lang == 'typescript'
        with:
          node-version: 20

      - name: Publish npm
        if: matrix.lang == 'typescript'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd sdks/typescript
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")

          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "Version exists — skipping"
          else
            npm publish --access public
          fi

# ---------------- Rust ----------------

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.lang == 'rust'

      - name: Publish Rust
        if: matrix.lang == 'rust'
        run: |
          cd sdks/rust

          VERSION=$(grep '^version' Cargo.toml | cut -d '"' -f2)

          if cargo search keynetra-client | grep "$VERSION"; then
            echo "Version exists"
          else
            cargo publish --token ${{ secrets.CRATES_TOKEN }}
          fi

# ---------------- .NET ----------------

      - uses: actions/setup-dotnet@v4
        if: matrix.lang == 'dotnet'
        with:
          dotnet-version: 8.0.x

      - name: Publish NuGet
        if: matrix.lang == 'dotnet'
        run: |
          cd sdks/csharp
          dotnet pack -c Release

          dotnet nuget push bin/Release/*.nupkg \
          --api-key ${{ secrets.NUGET_TOKEN }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

# ------------------------------------------------------------
# REGISTRY VERIFY
# ------------------------------------------------------------

  verify:
    name: 🔎 Registry Verify
    needs: publish
    runs-on: ubuntu-latest

    steps:

      - name: Wait registry indexing
        run: sleep ${{ env.REGISTRY_WAIT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python
        run: |
          pip install keynetra-client || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify npm
        run: |
          npm install @keynetra/client || true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust
        run: |
          cargo search keynetra-client || true

# ------------------------------------------------------------
# SUMMARY
# ------------------------------------------------------------

  summary:
    name: 🎉 Release Summary
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Summary
        run: |
          echo "## 🚀 KeyNetra SDK Release Completed" >> $GITHUB_STEP_SUMMARY
          echo "All SDK pipelines finished successfully." >> $GITHUB_STEP_SUMMARY