name: 🚀 Release SDKs

on:
  push:
    tags:
      - sdk-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: 🏗️ Build & Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 🏷️ Resolve SDK version
        id: version
        run: echo "value=${GITHUB_REF_NAME#sdk-v}" >> "$GITHUB_OUTPUT"

      - name: 📦 Install OpenAPI Generator
        run: npm install -g @openapitools/openapi-generator-cli

      - name: 🛠️ Generate SDKs
        env:
          SDK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          chmod +x scripts/generate-all.sh scripts/prepare-packages.sh
          ./scripts/generate-all.sh

      - name: 💾 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-sdks
          path: sdks

  python:
    name: 🐍 Publish Python
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Build & Check
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/python'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-python'
          user-email: business.keynetra@gmail.com
          target-branch: main

  typescript:
    name: 📘 Publish TypeScript
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: 🚀 Publish to npm
        working-directory: sdks/typescript
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/typescript'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-typescript'
          user-email: business.keynetra@gmail.com
          target-branch: main

  go:
    name: 🐹 Publish Go
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/go'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-go'
          user-email: business.keynetra@gmail.com
          target-branch: main

      - name: 🏷️ Create release tag in target repo
        run: |
          # This requires the PAT to have permission to tag the remote repo
          # The mirror action above pushes to 'main'. We also need to tag it.
          # For now, we'll assume the mirror action doesn't handle tags automatically.
          # A better way might be to push directly with git.
          echo "Mirrored to keynetra-go"

  java:
    name: ☕ Publish Java
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: 🚀 Publish to Maven
        working-directory: sdks/java
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./gradlew publish

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/java'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-java'
          user-email: business.keynetra@gmail.com
          target-branch: main

  rust:
    name: 🦀 Publish Rust
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🚀 Publish to crates.io
        working-directory: sdks/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/rust'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-rust'
          user-email: business.keynetra@gmail.com
          target-branch: main

  csharp:
    name: 💎 Publish C#
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 💠 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Pack NuGet package
        working-directory: sdks/csharp/src/KeyNetra.Client
        run: dotnet pack -c Release -p:PackageVersion=${{ needs.prepare.outputs.version }}

      - name: 🚀 Publish to NuGet
        working-directory: sdks/csharp/src/KeyNetra.Client/bin/Release
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/csharp'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-csharp'
          user-email: business.keynetra@gmail.com
          target-branch: main

  php:
    name: 🐘 Publish PHP
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: ✅ Validate composer.json
        working-directory: sdks/php
        run: composer validate

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/php'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-php'
          user-email: business.keynetra@gmail.com
          target-branch: main

  ruby:
    name: 💎 Publish Ruby
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: 🚀 Build & Publish Gem
        working-directory: sdks/ruby
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          touch ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          printf "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > ~/.gem/credentials
          gem build *.gemspec
          gem push *.gem

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/ruby'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-ruby'
          user-email: business.keynetra@gmail.com
          target-branch: main

  kotlin:
    name: 📱 Publish Kotlin
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 🛠️ Build Kotlin Library
        working-directory: sdks/kotlin
        run: ./gradlew build

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/kotlin'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-kotlin'
          user-email: business.keynetra@gmail.com
          target-branch: main

  swift:
    name: 🍎 Publish Swift
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📂 Download SDKs
        uses: actions/download-artifact@v4
        with:
          name: generated-sdks
          path: sdks

      - name: 🔄 Mirror to dedicated repo
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.SDK_MIRROR_TOKEN }}
        with:
          source-directory: 'sdks/swift'
          destination-github-username: 'keynetra'
          destination-repository-name: 'keynetra-swift'
          user-email: business.keynetra@gmail.com
          target-branch: main

      - name: 🏷️ Create release tag in target repo
        run: |
          echo "Mirrored to keynetra-swift"
